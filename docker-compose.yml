# docker-compose.yml
# Локальное окружение для разработки
#
# Запуск:    docker compose up -d
# Остановка: docker compose down
# Логи:      docker compose logs -f

services:
  # ==================== ПРИЛОЖЕНИЯ ====================

  order-service:
    build: ./order-service
    env_file:
      - ./order-service/.env.docker
    ports:
      - "9020:9020"
    networks:
      - monitoring
    depends_on:
      postgres_order-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U testuser -d testdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  catalog-service:
    build: ./catalog-service
    env_file:
      - ./catalog-service/.env.docker
    ports:
      - "8080:8080"
    networks:
      - monitoring
    depends_on:
      postgres_catalog-service:
        condition: service_healthy
  # ==================== БАЗЫ ДАННЫХ ====================

  postgres_order-service:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    networks:
      - monitoring
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U testuser -d testdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  postgres_catalog-service:
    image: postgres:15.1-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5429:5432"
    networks:
      - monitoring
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test_user -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==================== ЭКСПОРТЕРЫ ====================

  postgres-exporter-order:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://testuser:testpass@postgres_order-service:5432/testdb?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring
    depends_on:
      - postgres_order-service

  postgres-exporter-catalog:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://test_user:test_password@postgres_catalog-service:5432/test_db?sslmode=disable"
    ports:
      - "9188:9187"
    networks:
      - monitoring
    depends_on:
      - postgres_catalog-service

  # ==================== МОНИТОРИНГ ====================

  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.3.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge