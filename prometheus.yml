global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:9020']

  - job_name: 'catalog-service'
    static_configs:
      - targets: ['catalog-service:8080']

  - job_name: 'postgres_order-service'
    static_configs:
      - targets: ['postgres-exporter-order:9187']

  - job_name: 'postgres_catalog-service'
    static_configs:
      - targets: ['postgres-exporter-catalog:9187']